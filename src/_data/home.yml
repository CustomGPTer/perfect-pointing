seo_title: Repointing Rochdale, Oldham & Greater Manchester | Perfect Pointing
seo_description: Brick, stone and lime repointing across Rochdale, Oldham, Bury, Heywood, Middleton and Greater Manchester. Established 2000. Free quotes from Scott Higginson — 07707 724033.
hero_image: /images/uploads/hero.jpg
hero_heading: Repointing done properly, since 2000.
hero_text: Brick, stone and lime repointing for homes across Rochdale, Oldham, Bury and the rest of Greater Manchester. Chimneys, gables, garden walls and patios. Every job quoted in person by Scott, every joint raked out to depth, every wall finished to last decades — not a skim over the old.
