compare_caption: Drag the slider — the same stone house before and after repointing by Scott and the team.
why_eyebrow: Why pointing fails
why_heading: Most bad repointing was never bonded to anything
why_text: Smear new mortar over old and it looks fine for a year. Then it falls off in sheets because it only ever gripped the surface. Rain gets behind it and the wall is worse than before you started.
why_points:
  - title: Raked to depth
    text: every joint cut back to at least twice its width before a trowel goes near it.
  - title: Right mortar for the age of the house
    text: lime for solid-wall period homes, cement for cavity-wall.
  - title: Packed and struck
    text: fully compacted, then finished to the profile already on your house.
  - title: Protected while it cures
    text: sheeted against frost, sun and heavy rain.
team_eyebrow: Scott and the team
team_heading: The same standard, whoever's on the wall
team_text: Scott quotes every job himself and sets out exactly what's to be done. The team who do the work have been with him for years, use the same mixes and the same methods, and Scott signs every job off before you're asked to pay. Ten-year written guarantee on all of it.
team_image: /images/uploads/repoint.jpg
steps_eyebrow: How it works
steps_heading: From first call to finished wall
steps:
  - title: Call or send photos
    text: Ring Scott or send two or three photos through the contact form. You'll often get a rough figure the same day.
  - title: Free survey & quote
    text: Scott visits, checks the mortar, brick, damp and access, and sends a fixed-price written quote within 48 hours.
  - title: The work
    text: Sheeted up, raked out, test mixes dried against your wall, then pointed and struck. Washed down every evening.
  - title: Sign-off & guarantee
    text: Scott checks the finished work with you before you pay. Ten-year written workmanship guarantee on every job.
areas_eyebrow: Areas we cover
areas_heading: Repointing across Rochdale, Oldham, Bury and Greater Manchester
areas_text: Based in Rochdale and working within about 15 miles — the towns below, and most places between them. Tap a town for local details.
