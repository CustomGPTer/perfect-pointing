services:
  seo_title: Repointing Services Rochdale & Oldham | Perfect Pointing
  seo_description: Brick repointing, lime pointing, chimney repointing, stone pointing, patio pointing and brick repairs across Rochdale, Oldham and Greater Manchester. Guide prices and free quotes.
  heading: Pointing & repointing services
  intro: Every type of pointing on every type of property, from stone terraces in Rochdale to 1930s semis in Middleton. Guide prices are typical for a semi in Greater Manchester — Scott confirms a fixed price after seeing the wall.
  image: /images/uploads/terrace.jpg
  joints_eyebrow: Pointing styles
  joints_heading: Finished to match your house
  joints_text: The joint profile changes how the wall looks and how it sheds water. We match what's already on your house unless you'd rather change it. Tap a style to see where it's used and what it suits.
  faq_eyebrow: Common questions
  faq_heading: Before you call
  cta_heading: Not sure which service you need?
  cta_text: Send two or three photos of the wall. Scott will tell you what he sees and give a rough figure before he visits.
