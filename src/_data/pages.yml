about:
  seo_title: About Us — Rochdale Pointers Since 2000 | Perfect Pointing
  seo_description: Perfect Pointing was established in 2000 by Scott Higginson in Rochdale. Scott quotes every job personally; his team work to the same standard on every wall.
  heading: About Perfect Pointing
  intro: Established 2000. Rochdale based. Scott quotes it, the team build it, Scott signs it off.
  image: /images/uploads/worn.jpg
  portrait: /images/uploads/brick-pointed-tall.jpg
  portrait_alt: Freshly repointed red-brick wall — replace with a photo of Scott
  eyebrow: Scott Higginson · owner
  bio_heading: The person who quotes your job is the person who checks it
  bio: |
    Scott started on the trowel as a bricklayer and set up Perfect Pointing in 2000, after seeing too much repointing done badly — skimmed over old joints, wrong mortar for the age of the house, chimneys done off a ladder in twenty minutes.

    Twenty-five years on he still quotes every job in person and won't recommend repointing a wall that doesn't need it. If a couple of patches and a chimney will sort your damp problem, that's what you'll be quoted for.
  team_heading: The team
  team_text: |
    Scott works with a small team who've been with him for years. Everyone uses the same mixes, the same raking-out depth and the same finishing, and Scott walks every job before the customer is asked to pay. You get the owner's standard whether he's on the wall that day or not.
